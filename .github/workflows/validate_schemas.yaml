name: Validate schemas

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

permissions:
  contents: read

jobs:
  validate-schemas:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Fetch entire history for reliable git diff

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.10'

    - name: Get changed files
      id: changed-files
      uses: ./.github/actions/get-changed-files

    - name: List all changed files
      env:
        ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
      run: |
        for file in $ALL_CHANGED_FILES; do
          echo "$file was changed"
        done

    - name: Install dependencies
      run: pip install .

    - name: Run command on file list
      env:
        ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
      # Only files in the schema folders: hed_validate_schemas loads every .json it is given as a
      # schema, so repository data such as schema_versions.json and library_data.json must not reach it.
      run: |
        SCHEMA_FILES=$(printf '%s\n' $ALL_CHANGED_FILES | grep -E '^(standard_schema|library_schemas|schemas_latest_json|schemas_xml_unmerged)/' || true)
        if [ -z "$SCHEMA_FILES" ]; then
          echo "No schema files changed."
          exit 0
        fi
        hed_validate_schemas $SCHEMA_FILES
